spring:
  application:
    name: config-server
server:
  port: 7002

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/denisentanasembiring/job-portal-config"
          clone-on-start: true
          default-label: master

eureka:
  client:
    service-url:
      defaultZone: http://localhost:7861/eureka/
  instance:
    prefer-ip-address: true